# Prova manuale delle route di scrittura dell'area admin (ondata C) contro un
# deploy Vercel: gira su un runner GitHub, che raggiunge sia vercel.app sia
# Supabase (il container di Claude Code no). Le credenziali sono quelle degli
# utenti demo del tenant di prova; le operazioni sono reversibili o di prova
# (vedi scripts/verifica-scritture.mjs). Da lanciare a mano.
name: Verifica scritture admin

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL del deploy da provare
        required: true
      share_url:
        description: Link _vercel_share per le anteprime protette (vuoto per la produzione)
        required: false
        default: ''
      admin_password:
        description: Password dell'admin demo
        required: true
      auditor_password:
        description: Password dell'auditor demo
        required: true

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scritture contro il deploy
        env:
          URL: ${{ github.event.inputs.url }}
          SHARE_URL: ${{ github.event.inputs.share_url }}
          SUPABASE_URL: https://eqtiyqoxwgnerbmdkqff.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxdGl5cW94d2duZXJibWRrcWZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzOTE1NDksImV4cCI6MjA5NDk2NzU0OX0.fTfbtv9t3InpIcWtoyTgfaG550SALiwj45-_gRpNM_I
          ADMIN_EMAIL: admin@fad.local
          ADMIN_PASSWORD: ${{ github.event.inputs.admin_password }}
          AUDITOR_EMAIL: auditor@fad.local
          AUDITOR_PASSWORD: ${{ github.event.inputs.auditor_password }}
        run: node scripts/verifica-scritture.mjs
